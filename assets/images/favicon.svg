<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6e1a2b"/>
      <stop offset="65%" stop-color="#3b0813"/>
      <stop offset="100%" stop-color="#190207"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="60%" stop-color="#C59A27"/>
      <stop offset="100%" stop-color="#7A5809"/>
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>
  <!-- Ornate Inner Dotted Henna Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 10" opacity="0.95"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Center Royal Fleur-de-lis / Henna Crest Motif -->
  <g fill="url(#goldGrad)" filter="url(#goldShadow)">
    <text x="256" y="325" font-size="250" text-anchor="middle" font-family="'Segoe UI Symbol', 'Cinzel', 'Times New Roman', serif">⚜</text>
  </g>
</svg>

